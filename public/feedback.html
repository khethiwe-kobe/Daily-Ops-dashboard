var VIEW="__bars";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function bars(){
  var max=D.ranked[0][1], h="";
  D.ranked.forEach(function(r){
    h+='<div class="bar"><div class="lab">'+esc(r[0])+'</div><div class="track"><div class="fill" style="width:'+
       (100*r[1]/max).toFixed(1)+'%"></div></div><div class="num">'+r[1]+'</div></div>';
  });
  document.getElementById("bars").innerHTML=h;
}
function chips(){
  var opts=[["__bars","Overview"],["pos","Positive"],["neg","Negative"],["rec","Recommendations"]]
    .concat(D.ranked.map(function(r){return ["i:"+r[0], r[0]];}));
  var host=document.getElementById("chips"); host.innerHTML="";
  opts.forEach(function(o){
    var n = o[0]==="__bars" ? null
          : o[0].indexOf("i:")===0 ? (D.byIssue[o[0].slice(2)]||[]).length : D[o[0]].length;
    var b=document.createElement("button"); b.className="chip";
    b.setAttribute("aria-pressed", VIEW===o[0]?"true":"false");
    b.innerHTML=esc(o[1])+(n===null?"":'<span class="n">'+n+'</span>');
    b.onclick=function(){ VIEW=o[0]; render(); };
    host.appendChild(b);
  });
}
function rowsFor(){
  if(VIEW==="__bars") return null;
  if(VIEW.indexOf("i:")===0) return D.byIssue[VIEW.slice(2)]||[];
  return D[VIEW]||[];
}
function render(){
  chips();
  var list=document.getElementById("list"), bx=document.getElementById("bars");
  var rows=rowsFor();
  if(rows===null){ bx.style.display=""; list.innerHTML=""; return; }
  bx.style.display="none";
  if(!rows.length){ list.innerHTML='<div class="empty">Nothing here yet.</div>'; return; }
  var h="";
  rows.forEach(function(r){
    h+='<div class="card"><div class="meta"><span class="who">'+esc(r.c)+'</span>'+
       '<span class="pill p-'+esc(r.v)+'">'+esc(r.v)+'</span>'+
       '<span class="date">'+esc(r.d)+'</span>'+
       '<span class="subj">'+esc(r.s)+'</span>'+
       (r.g?'<a class="open" target="_blank" rel="noopener" href="https://serentia-shop.reamaze.com/admin/conversations/'+encodeURIComponent(r.g)+'">open thread &rarr;</a>':'')+
       '</div><div class="quote">'+esc(r.t)+'</div>'+
       (r.i&&r.i.length?'<div class="tags">'+r.i.map(function(x){return '<span class="tag">'+esc(x)+'</span>';}).join("")+'</div>':'')+
       '</div>';
  });
  list.innerHTML=h;
}
bars(); render();
